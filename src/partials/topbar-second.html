<div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <input type="search" class="form-control border-0 rounded-0 ps-0 form-focus-none" id="globalSearchInput"
          placeholder="Search any player..." aria-label="Search" aria-describedby="search-addon" />
        <button type="button" class="btn btn-primary btn-sm me-2" id="globalSearchSubmit">Search</button>
        <button type="button" class="btn btn-white btn-sm" data-bs-dismiss="modal" aria-label="Close">Esc</button>
      </div>

    </div>
  </div>

<script>
  function runGlobalSearch() {
    const input = document.getElementById('globalSearchInput');
    const query = input?.value.trim();
    if (query) {
      window.location.href = `@@webRoot/pages/athletes/revenue.html?search=${encodeURIComponent(query)}`;
    }
  }

  document.getElementById('globalSearchInput')?.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      runGlobalSearch();
    }
  });

  document.getElementById('globalSearchSubmit')?.addEventListener('click', runGlobalSearch);

  document.getElementById('logoutBtn')?.addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      await fetch('/api/auth/logout/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      });
    } catch (error) {
      console.error('Logout error:', error);
    }
    localStorage.removeItem('auth_user');
    window.location.href = '@@webRoot/pages/authentication/sign-in.html';
  });
</script>
