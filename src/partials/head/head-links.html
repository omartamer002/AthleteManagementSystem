<!-- Color modes -->
<script src="@@webRoot/assets/js/vendors/color-modes.js"></script>
<script>
  if (localStorage.getItem('sidebarExpanded') === 'false') {
    document.documentElement.classList.add('collapsed');
    document.documentElement.classList.remove('expanded');
  } else {
    document.documentElement.classList.remove('collapsed');
    document.documentElement.classList.add('expanded');
  }

  // Auth redirect logic
  const isAuthPage = window.location.pathname.includes('/authentication/');
  const userStr = localStorage.getItem('auth_user');
  
  if (!userStr && !isAuthPage) {
    window.location.href = '@@webRoot/pages/authentication/sign-in.html';
  } else if (userStr) {
    try {
      const user = JSON.parse(userStr);
      if (user.expiresAt && Date.now() > user.expiresAt) {
        localStorage.removeItem('auth_user');
        if (!isAuthPage) {
          window.location.href = '@@webRoot/pages/authentication/sign-in.html';
        }
      }
    } catch (e) {
      console.error('Auth parse error', e);
    }
  }
</script>
